{{- $isArticle := and .IsPage (eq .Section "posts") -}}
<div class="adblock-notice" role="{{ if $isArticle }}dialog{{ else }}status{{ end }}" aria-modal="{{ if $isArticle }}true{{ else }}false{{ end }}" aria-labelledby="adblock-notice-title" hidden data-blocking="{{ if $isArticle }}true{{ else }}false{{ end }}" data-nosnippet>
    <div class="adblock-notice__panel">
        <span class="adblock-notice__label">AD BLOCKER DETECTED</span>
        <h2 id="adblock-notice-title">请允许本站展示广告</h2>
        <p>检测到广告拦截功能。请将拾光集加入允许列表，然后刷新本页面。</p>
        <p class="adblock-notice__en">We detected an ad blocker. Please allow ads on this site, then refresh the page.</p>
        <div class="adblock-notice__links">
            <a href="https://www.tood.win/posts/please-allow-ads-on-shiguangji-zh/">中文说明</a>
            <a href="https://www.tood.win/posts/please-allow-ads-on-shiguangji-en/" lang="en">English guide</a>
        </div>
        {{- if not $isArticle }}
        <button type="button" class="adblock-notice__close">暂时关闭提示</button>
        {{- end }}
    </div>
</div>
<script>
(() => {
    const allowlist = [
        '/please-allow-ads-on-shiguangji-zh/',
        '/please-allow-ads-on-shiguangji-en/'
    ];
    const path = `${window.location.pathname.replace(/\/+$/, '')}/`.toLowerCase();
    const isAllowlisted = allowlist.some((slug) => path.endsWith(slug));

    if (isAllowlisted) return;

    const notice = document.querySelector('.adblock-notice');
    if (!notice) return;

    let revealed = false;
    let detectionStarted = false;
    const revealNotice = () => {
        if (revealed) return;
        revealed = true;
        notice.hidden = false;
        if (notice.dataset.blocking === 'true') {
            document.documentElement.classList.add('adblock-access-blocked');
        }
        notice.querySelector('.adblock-notice__close')?.addEventListener('click', () => {
            notice.hidden = true;
        });
    };

    const startDetection = () => {
        if (detectionStarted) return;
        detectionStarted = true;
        const probeRequest = (url) => new Promise((resolve) => {
            const controller = new AbortController();
            const timer = window.setTimeout(() => {
                controller.abort();
                resolve(false);
            }, 3000);
            fetch(url, {
                mode: 'no-cors',
                cache: 'no-store',
                signal: controller.signal
            }).then(() => {
                window.clearTimeout(timer);
                resolve(true);
            }).catch(() => {
                window.clearTimeout(timer);
                resolve(false);
            });
        });
        const probeScript = (url) => new Promise((resolve) => {
            const script = document.createElement('script');
            const finish = (loaded) => {
                window.clearTimeout(timer);
                script.remove();
                resolve(loaded);
            };
            const timer = window.setTimeout(() => finish(false), 3000);
            script.async = true;
            script.src = url;
            script.onload = () => finish(true);
            script.onerror = () => finish(false);
            document.head.appendChild(script);
        });

        const bait = document.createElement('div');
        bait.id = 'ad-banner';
        bait.className = 'adsbox ad-banner ad-unit advertisement ad-placement pub_300x250 text-ad sponsored-content';
        bait.setAttribute('aria-hidden', 'true');
        bait.style.cssText = 'position:absolute!important;left:-10000px!important;top:-10000px!important;width:2px!important;height:2px!important;pointer-events:none!important;';
        document.body.appendChild(bait);

        let localProbeBlocked = false;
        const localProbe = document.createElement('script');
        localProbe.async = true;
        localProbe.src = `/js/advertisement.js?probe=${Date.now()}`;
        localProbe.onload = () => {
            localProbe.remove();
        };
        localProbe.onerror = () => {
            localProbeBlocked = true;
            localProbe.remove();
            revealNotice();
        };
        document.head.appendChild(localProbe);

        Promise.all([
            probeRequest(`https://www.google.com/generate_204?adblock_control=${Date.now()}`),
            probeRequest(`https://www.gstatic.com/generate_204?adblock_control=${Date.now()}`),
            probeScript(`https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?adblock_probe=${Date.now()}`)
        ]).then(([googleLoaded, gstaticLoaded, adsLoaded]) => {
            if ((googleLoaded || gstaticLoaded) && !adsLoaded) {
                revealNotice();
            }
        });

        window.setTimeout(() => {
            const style = window.getComputedStyle(bait);
            const baitBlocked = style.display === 'none' || style.visibility === 'hidden' || bait.offsetHeight === 0 || bait.offsetWidth === 0;
            bait.remove();
            if (baitBlocked || localProbeBlocked) {
                revealNotice();
            }
        }, notice.dataset.blocking === 'true' ? 1000 : 2500);
    };

    if (notice.dataset.blocking !== 'true') {
        startDetection();
        return;
    }

    let touchStartY = null;
    let scrollBaseline = window.scrollY;
    let scrollReady = document.readyState === 'complete';
    const downwardKeys = new Set(['ArrowDown', 'PageDown', 'End', ' ']);
    const cleanupScrollTriggers = () => {
        window.removeEventListener('wheel', onWheel);
        window.removeEventListener('touchstart', onTouchStart);
        window.removeEventListener('touchmove', onTouchMove);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('scroll', onScroll);
    };
    const triggerAfterDownwardScroll = () => {
        cleanupScrollTriggers();
        startDetection();
    };
    const onWheel = (event) => {
        if (event.deltaY > 0) triggerAfterDownwardScroll();
    };
    const onTouchStart = (event) => {
        touchStartY = event.touches[0]?.clientY ?? null;
    };
    const onTouchMove = (event) => {
        const currentY = event.touches[0]?.clientY;
        if (touchStartY !== null && currentY !== undefined && touchStartY - currentY >= 16) {
            triggerAfterDownwardScroll();
        }
    };
    const onKeyDown = (event) => {
        if (downwardKeys.has(event.key) && !(event.key === ' ' && event.shiftKey)) {
            triggerAfterDownwardScroll();
        }
    };
    const onScroll = () => {
        const currentY = window.scrollY;
        if (!scrollReady) {
            scrollBaseline = currentY;
            return;
        }
        if (currentY - scrollBaseline >= 24) {
            triggerAfterDownwardScroll();
        }
    };
    const markScrollReady = () => {
        window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
                scrollBaseline = window.scrollY;
                scrollReady = true;
            });
        });
    };

    window.addEventListener('wheel', onWheel, { passive: true });
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('scroll', onScroll, { passive: true });
    if (!scrollReady) {
        window.addEventListener('load', markScrollReady, { once: true });
    } else {
        markScrollReady();
    }
})();
</script>
