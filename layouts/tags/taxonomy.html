{{ define "main" }}
<div class="archive-article-layout">
    <div class="archive-article-main">
        {{- $tags := .Site.Taxonomies.tags -}}
        <header class="archive-tags-header">
            <h1>{{ default "标签" .Title }}</h1>
            <span>{{ printf "%03d" (len $tags) }} TAGS</span>
        </header>
        <section class="archive-tags-cloud article-tag-cloud" aria-label="标签云">
            {{- range $tag, $pages := $tags -}}
                <a href="{{ printf "tags/%s/" ($tag | urlize) | relLangURL }}">
                    {{ $tag }}<sup>{{ len $pages }}</sup>
                </a>
            {{- else -}}
                <p class="archive-tags-empty">暂无标签</p>
            {{- end -}}
        </section>
    </div>

    {{ partial "article/sidebar.html" . }}
</div>

<div class="article-float-actions" aria-hidden="true">
    <button class="article-back-to-top" type="button" aria-label="返回页面顶部" title="返回顶部" tabindex="-1">
        <span aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
                <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path>
            </svg>
        </span>
    </button>
    <button class="article-go-to-bottom" type="button" aria-label="跳转到底部" title="跳转到底部" tabindex="-1">
        <span aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
                <path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"></path>
            </svg>
        </span>
    </button>
</div>

<script>
(() => {
    const container = document.querySelector('.article-float-actions');
    const topBtn = container.querySelector('.article-back-to-top');
    const bottomBtn = container.querySelector('.article-go-to-bottom');
    if (!container || !topBtn || !bottomBtn) return;

    const placeButtons = () => {
        const main = document.querySelector('.archive-article-main');
        const sidebar = document.querySelector('.archive-article-sidebar');
        const x = (window.innerWidth <= 1180 || !main || !sidebar)
            ? null
            : `${(main.getBoundingClientRect().right + sidebar.getBoundingClientRect().left) / 2}px`;
        container.style.setProperty('--float-x', x || 'auto');
        container.style.setProperty('--float-right', x ? 'auto' : '16px');
    };

    const updateButtons = () => {
        const scrollY = window.scrollY;
        const docHeight = document.documentElement.scrollHeight;
        const viewHeight = window.innerHeight;
        const nearBottom = scrollY + viewHeight >= docHeight - 60;
        const farFromTop = scrollY > 360;

        const footer = document.querySelector('.archive-footer');
        const baseBottom = window.innerWidth <= 700 ? 16 : 26;
        const footerOffset = footer ? Math.max(0, viewHeight - footer.getBoundingClientRect().top) : 0;
        const bottom = `${Math.max(baseBottom, footerOffset + 12)}px`;
        container.style.setProperty('--float-bottom', bottom);

        topBtn.classList.toggle('is-visible', farFromTop);
        topBtn.setAttribute('aria-hidden', farFromTop ? 'false' : 'true');
        topBtn.tabIndex = farFromTop ? 0 : -1;

        bottomBtn.classList.toggle('is-visible', !nearBottom);
        bottomBtn.setAttribute('aria-hidden', nearBottom ? 'true' : 'false');
        bottomBtn.tabIndex = nearBottom ? -1 : 0;
    };

    window.addEventListener('scroll', updateButtons, { passive: true });
    window.addEventListener('resize', () => { placeButtons(); updateButtons(); }, { passive: true });
    topBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
    bottomBtn.addEventListener('click', () => {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
    updateButtons();
    placeButtons();
})();
</script>
{{ end }}
